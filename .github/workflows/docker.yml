name: Build, Scan, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install Backend Dependencies
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      # Run Unit Tests
      - name: Run Unit Tests
        working-directory: backend
        run: npm test || true

      # SonarQube Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Gitleaks Secret Scan
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependency Scan
      - name: npm Audit
        working-directory: backend
        run: npm audit --audit-level=high || true

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Backend Image
      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest ./backend

      # Build Frontend Image
      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest ./frontend

      # Trivy Scan Backend
      - name: Trivy Scan Backend
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest

      # Trivy Scan Frontend
      - name: Trivy Scan Frontend
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest

      # Push Backend Image
      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest

      # Push Frontend Image
      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest

      # Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/DevOps--app

            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

            docker compose pull

            docker compose down || true

            docker compose up -d

            docker image prune -f

      # Slack Notification
      - name: Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚀 GitHub Actions Pipeline Notification"
            attachments:
              - color: "${{ job.status == 'success' && 'good' || 'danger' }}"
                fields:
                  - title: Repository
                    value: "${{ github.repository }}"
                    short: true
                  - title: Workflow
                    value: "${{ github.workflow }}"
                    short: true
                  - title: Branch
                    value: "${{ github.ref_name }}"
                    short: true
                  - title: Status
                    value: "${{ job.status }}"
                    short: true
                  - title: Commit
                    value: "${{ github.sha }}"
                    short: false
                  - title: Triggered By
                    value: "${{ github.actor }}"
                    short: true
                  - title: Run
                    value: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    short: false

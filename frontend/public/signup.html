<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps AI - Sign Up</title>

    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="auth-container">

    <div class="left-panel">

        <h1>Join DevOps AI 🚀</h1>

        <p>
            Create your account and start learning Docker,
            Kubernetes, AWS, Linux and DevOps with AI.
        </p>

    </div>

    <div class="right-panel">

        <h2>Create Account</h2>

        <form id="signupForm">

            <div class="input-box">
                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required>
            </div>

            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>
            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

<script src="js/signup.js"></script>

</body>
</html>
